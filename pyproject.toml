[project]
name = "voice-agent-workshop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "livekit-agents[deepgram,google,mcp,openai,silero,turn-detector]>=1.5",
    "livekit-plugins-noise-cancellation~=0.2",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "tzdata>=2024.1", # IANA timezone data for ZoneInfo in slim Docker images
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

