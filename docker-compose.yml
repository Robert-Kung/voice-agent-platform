services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        LIVEKIT_URL: ${LIVEKIT_URL}
        LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
        LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
        AGENT_NAME: ${AGENT_NAME:-}
    ports:
      - "3003:3000"
    env_file:
      - .env
    restart: unless-stopped
