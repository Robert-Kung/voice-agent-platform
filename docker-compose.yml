services:
  # ── Management API ──────────────────────────────────────────
  # FastAPI — profiles / sessions / stats CRUD，供 admin UI 使用。
  # 與 agent 共用同一個 SQLite 檔（data volume）。
  api:
    build:
      context: ./agents
      dockerfile: Dockerfile
      network: host
    command:
      - "uv"
      - "run"
      - "uvicorn"
      - "api.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8083"
    # `expose` (not `ports`) — keep the admin API inside the compose network
    # so only the frontend service can reach it. Removing the host port
    # closes a back-channel that bypasses the Next.js middleware auth gate.
    # For local dev outside docker, run uvicorn directly on the host instead.
    expose:
      - "8083"
    env_file:
      - .env
    environment:
      - AGENT_DB_PATH=/app/data/agent_platform.db
      # `lk` still stats $HOME/.livekit/cli-config.yaml even when --url/--api-key/--api-secret
      # come from env vars; point HOME at a writable empty dir so stat returns ENOENT cleanly.
      - HOME=/app
    volumes:
      - ./data:/app/data
      # Share profiles dir with host so DB→YAML exports (used by /deploy/redeploy)
      # show up on disk and make it into `lk agent deploy`'s upload tarball.
      - ./agents/profiles:/app/profiles
    restart: unless-stopped

  # ── Frontend (Next.js) ──────────────────────────────────────
  # Voice 測試頁 (`/`) + Admin UI (`/admin/*`)。
  #
  # Browser → Next.js middleware (ADMIN_PASSWORD cookie) → /api/admin-proxy/*
  # → FastAPI at $ADMIN_API_URL (X-Admin-Token injected server-side).
  # ADMIN_API_TOKEN is read from .env at runtime; never baked into the bundle.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        LIVEKIT_URL: ${LIVEKIT_URL}
        LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
        LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
        AGENT_NAME: ${AGENT_NAME:-}
    ports:
      - "3004:3000"
    env_file:
      - .env
    environment:
      # Inside the docker-compose network, FastAPI is reached by service name.
      # Overrides whatever ADMIN_API_URL is set to in .env (which is tuned for
      # local non-docker dev: http://localhost:8083).
      - ADMIN_API_URL=http://api:8083
    depends_on:
      - api
    restart: unless-stopped
