# ============================================================
# Agent Profile 格式範例
# 複製此檔案並依業務需求修改，不要直接修改本檔案
# ============================================================

name: "我的店家名稱"
agent_name: "voice-assistant-example"   # WorkerOptions 使用的名稱
language: "zh"                          # 語言代碼（zh / en / ja …）
timezone: "Asia/Taipei"                 # pytz / zoneinfo 時區字串

# 進線第一句歡迎語（由 on_enter 直接 say()）
welcome_message: |
  您好，歡迎致電範例店家。
  查詢服務 A 請說一，查詢服務 B 請說二，
  需要重聽請說零。

# Human Operator（轉真人服務）設定 — enabled=true 時 agent_factory 自動掛 transfer_to_human tool
human_operator:
  enabled: true
  instructions: |
    你是範例店家的門市人員。
    告知使用者已轉接成功，詢問有什麼可以協助的。
  greeting: "親切告知已轉接門市人員。兩句話以內。"
  voice: "Puck"                      # realtime 模式下轉接後的聲音（與主 agent Kore 區分）

# QA 模式：inline = 啟動時嵌入 instructions（零延遲，預設）；tool = 保留 lookup_qa tool call（QA 量大時用）
qa_mode: inline

# ── 模型設定（可選 models 區塊）──────────────────────────────
# 省略整個 models 區塊 → 行為與舊版完全相同（pipeline 預設 FallbackAdapter 清單，
# 或 realtime 預設 Gemini Live + Deepgram STT）。逐欄省略則該欄回填內建預設。
#
# 每個 llm/stt/tts 是「spec 清單」：第一個為主選，其餘為 fallback chain
# （多個 → FallbackAdapter；單一 → 裸元件，無 fallback 安全網）。
#   provider/model：模型；via：inference（gateway，預設）| direct（SDK + API key）
#   direct 目前僅支援 deepgram（STT）與 google（realtime）；其餘 direct 會報錯
#
# ⚠️ 單一 pinned 模型沒有 fallback：provider 接通回錯（如 gpt-5.4/400）會讓該輪直接失敗。
#    要安全請配至少一個 fallback spec（首次切換約有 5s 延遲）。
#
# models:
#   mode: pipeline          # pipeline | realtime；省略時用 AGENT_MODE env / 預設
#   llm:
#     - { provider: google, model: gemini-3.1-flash-lite, via: inference, options: { temperature: 0.7 } }
#     - { provider: openai, model: gpt-4.1-mini, via: inference }   # fallback
#   stt:
#     - { provider: deepgram, model: nova-2, via: inference, language: zh-TW }
#   tts:
#     - { provider: cartesia, model: "sonic-3:9626c31c-...", via: inference, language: zh }
#   realtime:               # mode=realtime 時使用；LLM 永遠鎖 Gemini Live
#     model: gemini-2.5-flash-native-audio-preview-12-2025   # 須在 allowlist 內
#     voice: Kore
#     thinking_budget: 0
#     stt: { provider: deepgram, model: nova-2, via: direct, language: zh-TW }

# 主 Agent system prompt
instructions: |
  你是「範例店家」的電話語音客服。

  【核心任務】
  1. 呼叫 get_current_time 取得當下時間，配合下方【營業時間】判斷服務是否營業
  2. 引導使用者透過按鍵或語音取得資訊
  3. 僅依下方建檔的 QA 回答，不可編造
  4. 無法回答時呼叫 transfer_to_human

# ── 啟用的 Tools（Tier 1 通用工具）──────────────────────
# lookup_qa / transfer_to_human 由 agent_factory 依 qa_mode / human_operator.enabled 自動掛載
# 如需業務整合（送 LINE / 開單 / 查 CRM），改用 Tier 3 HTTP tool（待實作）
tools:
  - name: get_current_time           # 取得台灣現在時間 + 星期

# ── 服務營業時間（自動嵌入 instructions，配合 get_current_time 讓 LLM 自行判斷）─────────────
services:
  service_a:                         # service_type 對應的 key
    always_open: true
    hours_text: "服務 A 全天 24 小時提供。"

  service_b:
    always_open: false
    schedule:
      default:
        start: "09:00"
        end: "18:00"
    hours_text: "服務 B 每日上午 9 點至下午 6 點。"

  service_c:
    always_open: false
    closed_days: [6]                 # 0=Mon … 6=Sun
    schedule:
      weekday:
        start: "08:00"
        end: "17:00"
      saturday:
        start: "08:00"
        end: "12:00"
    hours_text:
      weekday: "平日上午 8 點至下午 5 點，週六上午 8 點至中午 12 點，週日休息。"
      saturday: "週六上午 8 點至中午 12 點，週日休息。"
      closed: "今日未營業，平日上午 8 點至下午 5 點，週六上午 8 點至中午 12 點。"

# ── QA 資料庫（lookup_qa 使用）──────────────────────────
qa_data:
  - keywords: ["關鍵字1", "關鍵字2"]
    answer: "對消費者播報的完整語音內容，語氣口語自然。"

  - keywords: ["費用", "多少錢", "收費"]
    answer: "服務費用依項目而異，詳細費用請現場詢問。"

  - keywords: ["預約", "需要預約"]
    answer: "本站採現場辦理，無需預約，依順序服務。"
