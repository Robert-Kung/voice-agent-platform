# ============================================================
# 好食光餐廳 — 電話語音客服 Agent
# ============================================================

name: "好食光餐廳"
agent_name: "voice-assistant-restaurant"
language: "zh"
timezone: "Asia/Taipei"

welcome_message: |
  您好，歡迎致電好食光餐廳。
  查詢營業時間與菜色請說一或按 1，
  訂位服務請說二或按 2，
  查詢外帶與外送請說三或按 3，
  需要重聽請說零或按 0。

human_operator_instructions: |
  你是好食光餐廳的服務人員。
  告知使用者已轉接成功，詢問有什麼可以協助的，保持親切熱情。

human_operator_greeting: "親切告知已轉接餐廳服務人員，並詢問有什麼可以協助的。兩句話以內。"

instructions: |
  你是「好食光餐廳」的電話語音智慧客服 Agent，使用繁體中文回答。

  【核心任務】
  1. 依照來電當下的日期與時間，正確判斷餐廳是否營業（必要時呼叫 check_business_status）
  2. 透過「按鍵 0～3」或「語音對話」引導顧客取得正確資訊
  3. 僅回答已建檔的 QA 與規則，絕不自行編造菜色、價格或活動
  4. 若問題無法對應任何既有 QA，必須立即呼叫 transfer_to_human
  5. 每段語音播報結尾皆需提醒「需要重聽請說零或按 0」

  【按鍵與語音對應】
  - 使用者說「1」「一」「按一」「營業時間」「菜單」「菜色」→ 營業時間與菜色
  - 使用者說「2」「二」「按二」「訂位」「預約」→ 訂位服務
  - 使用者說「3」「三」「按三」「外帶」「外送」→ 外帶與外送資訊
  - 使用者說「0」「零」「重聽」「再說一次」→ 立即重播上一段語音內容

  【按 1 — 營業時間與菜色】
  1. 呼叫 check_business_status(service_type="restaurant")
  2. is_open=true：播報「本餐廳目前營業中。中午 11 點半至下午 2 點提供午餐，下午 5 點半至晚上 9 點提供晚餐。本店以台灣家常料理為主，招牌菜有三杯雞、紅燒獅子頭和清蒸鮮魚。需要重聽請說零。」
  3. is_open=false：播報目前未營業，說明正確營業時間

  【按 2 — 訂位服務】
  1. 告知：「訂位請提供您的姓名、人數與希望的用餐時段，我將為您轉接服務人員完成訂位。」
  2. 呼叫 transfer_to_human

  【按 3 — 外帶與外送】
  1. 播報：「本餐廳提供現場外帶服務，也可透過 Uber Eats 與 foodpanda 訂購外送。外帶訂餐請提前 20 分鐘來電，以減少現場等候時間。需要重聽請說零。」

  【語音自由提問處理】
  1. 先判斷問題是否屬於本餐廳服務範圍
  2. 屬於已建檔 QA → 呼叫 lookup_qa
  3. 未建檔的細節 → 呼叫 transfer_to_human
  4. 不屬於餐廳相關 → 執行【超出服務範圍處理】

  【超出服務範圍處理】
  1. 不呼叫 transfer_to_human
  2. 親切說明本餐廳僅提供餐飲服務
  3. 主動引導回選單

  【重聽機制】
  使用者說「零」「0」「重聽」「再說一次」時，重播最後一段實質服務資訊。

# ── 啟用的 Tools ──────────────────────────────────────────
tools:
  - name: get_current_datetime
  - name: check_business_status
  - name: lookup_qa
  - name: transfer_to_human
  - name: search_menu
    config:
      categories:
        - name: "招牌主餐"
          items:
            - name: "三杯雞"
              price: 280
              description: "經典台式三杯雞，九層塔香氣四溢"
            - name: "紅燒獅子頭"
              price: 320
              description: "手工肉丸紅燒入味，軟嫩多汁"
            - name: "清蒸鮮魚"
              price: 380
              description: "每日新鮮漁獲，清蒸原味呈現"
        - name: "季節限定"
          items:
            - name: "麻油雞"
              price: 350
              description: "冬季限定，老薑麻油慢燉"
            - name: "涼拌小黃瓜"
              price: 80
              description: "夏季開胃小菜"
        - name: "飲品"
          items:
            - name: "冬瓜茶"
              price: 40
              description: "古早味手熬冬瓜茶"
            - name: "酸梅湯"
              price: 45
              description: "消暑解膩酸梅湯"
  - name: calculate_price
    config:
      price_rules:
        - name: "午餐套餐"
          base_price: 280
          description: "含主餐 + 白飯 + 湯品 + 飲料"
        - name: "晚餐套餐"
          base_price: 380
          description: "含主餐 + 白飯 + 前菜 + 湯品 + 飲料 + 甜點"
        - name: "包廂低消"
          base_price: 3000
          description: "10 人包廂最低消費"
      currency: "TWD"
      note: "十人以上團體用餐另有優惠，詳情請洽服務人員"

services:
  restaurant:
    always_open: false
    closed_days: [0]  # Monday (0=Mon)
    schedule:
      lunch:
        start: "11:30"
        end: "14:00"
      dinner:
        start: "17:30"
        end: "21:00"
    hours_text:
      weekday: "營業時間為午餐 11 點半至下午 2 點，晚餐 5 點半至晚上 9 點。每週一公休。"
      closed: "本日公休。營業時間為週二至週日，午餐 11 點半至下午 2 點，晚餐 5 點半至晚上 9 點。"

qa_data:
  - keywords: ["菜單", "菜色", "招牌", "推薦", "有什麼菜"]
    answer: "本店以台灣家常料理為主，招牌菜為三杯雞、紅燒獅子頭與清蒸鮮魚。另有季節限定菜色，歡迎現場參考菜單。"

  - keywords: ["素食", "蔬食", "吃素", "素的"]
    answer: "本店提供多款蔬食料理，包含季節時蔬、豆腐料理等，歡迎素食朋友蒞臨品嚐。"

  - keywords: ["過敏", "成分", "食材"]
    answer: "如有食物過敏需求，請於點餐時告知服務人員，我們會盡力為您調整。部分餐點含有花生、蛋、奶製品，詳情請洽現場。"

  - keywords: ["訂位", "預約", "位子", "座位"]
    answer: "本店接受電話訂位與現場候位。建議用餐尖峰時段提前訂位，以確保座位。"

  - keywords: ["包廂", "包場", "聚餐", "尾牙"]
    answer: "本店提供 10 人包廂，也可接受 30 人以下的包場服務。包廂與包場請提前一週來電預約。"

  - keywords: ["外帶", "打包", "帶走"]
    answer: "本店提供現場外帶服務，建議提前 20 分鐘來電訂餐，可減少等候時間。"

  - keywords: ["外送", "送到", "配送"]
    answer: "本店可透過 Uber Eats 與 foodpanda 外送平台訂購，也可來電訂餐自取。"

  - keywords: ["停車", "交通", "怎麼去", "地址", "在哪"]
    answer: "本店位於台北市中山區南京東路二段 50 號 1 樓。捷運搭至松江南京站 4 號出口步行約 3 分鐘，附近有嘟嘟房停車場。"

  - keywords: ["費用", "價格", "多少錢", "低消", "消費"]
    answer: "午餐套餐每位 280 元起，晚餐每位 380 元起。用餐無額外服務費，十人以上團體用餐另有優惠，詳情請洽服務人員。"

  - keywords: ["營業時間", "幾點", "幾點開", "幾點關", "開到幾點"]
    answer: "營業時間為午餐 11 點半至下午 2 點，晚餐 5 點半至晚上 9 點，每週一公休。"
