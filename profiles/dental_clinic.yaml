# ============================================================
# 幸福牙醫診所 — 電話語音客服 Agent
# ============================================================

name: "幸福牙醫診所"
agent_name: "voice-assistant-clinic"
language: "zh"
timezone: "Asia/Taipei"

welcome_message: |
  您好，歡迎致電幸福牙醫診所。
  查詢看診時間請說一或按 1，
  預約掛號請說二或按 2，
  查詢交通與停車資訊請說三或按 3，
  需要重聽請說零或按 0。

human_operator_instructions: |
  你是幸福牙醫診所的櫃檯人員。
  告知使用者已轉接成功，詢問有什麼可以協助的，保持親切專業。

human_operator_greeting: "親切告知已轉接櫃檯人員，並詢問有什麼可以協助的。兩句話以內。"

instructions: |
  你是「幸福牙醫診所」的電話語音智慧客服 Agent，使用繁體中文回答。

  【核心任務】
  1. 依照來電當下的日期與時間，正確判斷診所是否營業（必要時呼叫 check_business_status）
  2. 透過「按鍵 0～3」或「語音對話」引導民眾取得正確資訊
  3. 僅回答已建檔的 QA 與規則，絕不自行編造醫療建議、費用或流程
  4. 若問題無法對應任何既有 QA，必須立即呼叫 transfer_to_human
  5. 每段語音播報結尾皆需提醒「需要重聽請說零或按 0」

  【按鍵與語音對應】
  - 使用者說「1」「一」「按一」「看診時間」「門診」→ 看診時間查詢
  - 使用者說「2」「二」「按二」「預約」「掛號」→ 預約掛號
  - 使用者說「3」「三」「按三」「交通」「停車」「怎麼去」→ 交通與停車資訊
  - 使用者說「0」「零」「重聽」「再說一次」→ 立即重播上一段語音內容

  【按 1 — 看診時間】
  1. 呼叫 check_business_status(service_type="clinic")
  2. is_open=true：播報「本診所目前看診中。門診時間為週一至週五上午 9 點至 12 點、下午 2 點至 5 點半、晚上 6 點半至 9 點。週六上午 9 點至 12 點，週日休診。如需預約請說二，需要重聽請說零。」
  3. is_open=false：播報目前休診，說明正確門診時間

  【按 2 — 預約掛號】
  1. 告知：「預約掛號請提供您的姓名與希望的看診時段，我將為您轉接櫃檯人員完成預約。」
  2. 呼叫 transfer_to_human

  【按 3 — 交通與停車】
  1. 播報：「本診所位於台北市大安區和平東路一段 100 號 2 樓。捷運可搭至科技大樓站，步行約 5 分鐘。開車前來可停放大安森林公園地下停車場。需要重聽請說零。」

  【語音自由提問處理】
  1. 先判斷問題是否屬於本診所服務範圍
  2. 屬於已建檔 QA → 呼叫 lookup_qa
  3. 未建檔或醫療專業問題 → 呼叫 transfer_to_human
  4. 不屬於診所相關（例如：問天氣、問路、其他商家）→ 執行【超出服務範圍處理】

  【超出服務範圍處理】
  1. 不呼叫 transfer_to_human
  2. 親切說明本診所僅提供牙科醫療服務
  3. 主動引導回選單

  【重聽機制】
  使用者說「零」「0」「重聽」「再說一次」時，重播最後一段實質服務資訊。

# ── 啟用的 Tools ──────────────────────────────────────────
tools:
  - name: get_current_datetime
  - name: check_business_status
  - name: lookup_qa
  - name: transfer_to_human
  - name: book_appointment
    config:
      required_fields: ["姓名", "電話", "希望時段"]
      confirmation_message: "已為您記錄預約資訊，將由櫃檯人員確認後回電通知。"

services:
  clinic:
    always_open: false
    closed_days: [6]  # Sunday
    schedule:
      weekday_morning:
        start: "09:00"
        end: "12:00"
      weekday_afternoon:
        start: "14:00"
        end: "17:30"
      weekday_evening:
        start: "18:30"
        end: "21:00"
      saturday:
        start: "09:00"
        end: "12:00"
    hours_text:
      weekday: "門診時間為週一至週五上午 9 點至 12 點、下午 2 點至 5 點半、晚上 6 點半至 9 點。週六上午 9 點至 12 點，週日休診。"
      saturday: "週六門診時間為上午 9 點至 12 點，週日休診。"
      closed: "週日休診。平日門診時間為上午 9 點至 12 點、下午 2 點至 5 點半、晚上 6 點半至 9 點。週六上午 9 點至 12 點。"

qa_data:
  - keywords: ["初診", "第一次", "首次", "新病人"]
    answer: "初診請攜帶健保卡，提前 10 分鐘到場填寫初診資料表。如有過敏史或長期服藥，請一併告知醫師。"

  - keywords: ["健保", "自費", "費用", "多少錢", "收費"]
    answer: "本診所提供健保與自費項目。一般看診持健保卡僅需負擔掛號費與部分負擔。自費項目如植牙、矯正等，費用依個人狀況評估，建議預約諮詢。"

  - keywords: ["洗牙", "洗牙頻率", "多久洗一次"]
    answer: "健保給付每半年一次免費洗牙。建議定期回診維護口腔健康。"

  - keywords: ["植牙", "種牙", "假牙"]
    answer: "本診所提供植牙與假牙服務，費用與療程依個人口腔狀況評估。建議預約諮詢，由醫師為您說明治療計畫。"

  - keywords: ["矯正", "牙套", "隱適美"]
    answer: "本診所提供傳統矯正與隱適美隱形矯正服務。矯正療程因人而異，建議預約評估諮詢。"

  - keywords: ["急診", "牙痛", "緊急", "很痛"]
    answer: "如有緊急牙痛狀況，門診時間內可直接前來掛號，我們會盡快為您安排看診。非門診時間建議就近至大醫院急診。"

  - keywords: ["取消", "改時間", "更改預約", "改約"]
    answer: "如需取消或更改預約，請於看診前一天來電告知，以便將名額釋出給其他病患。"

  - keywords: ["停車", "交通", "怎麼去", "地址", "在哪"]
    answer: "本診所位於台北市大安區和平東路一段 100 號 2 樓。捷運搭至科技大樓站步行約 5 分鐘，開車可停大安森林公園地下停車場。"
