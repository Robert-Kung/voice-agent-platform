# ============================================================
# Agent Profile 格式範例
# 複製此檔案並依業務需求修改，不要直接修改本檔案
# ============================================================

name: "我的店家名稱"
agent_name: "voice-assistant-example"   # WorkerOptions 使用的名稱
language: "zh"                          # 語言代碼（zh / en / ja …）
timezone: "Asia/Taipei"                 # pytz / zoneinfo 時區字串

# 進線第一句歡迎語（由 on_enter 直接 say()）
welcome_message: |
  您好，歡迎致電範例店家。
  查詢服務 A 請說一，查詢服務 B 請說二，
  需要重聽請說零。

# 轉人工後的 Agent system instructions
human_operator_instructions: |
  你是範例店家的門市人員。
  告知使用者已轉接成功，詢問有什麼可以協助的。

# 轉人工後 on_enter 播報指令
human_operator_greeting: "親切告知已轉接門市人員。兩句話以內。"

# 主 Agent system prompt
instructions: |
  你是「範例店家」的電話語音客服。

  【核心任務】
  1. 依時間判斷服務是否營業（呼叫 check_business_status）
  2. 引導使用者透過按鍵或語音取得資訊
  3. 僅回答已建檔的 QA，不可編造
  4. 無法回答時呼叫 transfer_to_human

# ── 啟用的 Tools ──────────────────────────────────────────
# 只列出此 agent 需要的 tools；移除不需要的項目可降低 LLM context
tools:
  - name: get_current_datetime       # 取得台灣現在時間
  - name: check_business_status      # 依服務別判斷是否營業
  - name: lookup_qa                  # 查詢 qa_data 中的 QA
  - name: transfer_to_human          # 轉接門市人員
  - name: replay_last_prompt         # 重播上一段語音（按 0）
  # - name: check_weather            # 選用：天氣查詢
  #   config:
  #     location: "台北市"
  #     conditions:
  #       - condition: "晴天"
  #         advice: "天氣晴朗，歡迎前來。"

# ── 服務營業時間（check_business_status 使用）─────────────
services:
  service_a:                         # service_type 對應的 key
    always_open: true
    hours_text: "服務 A 全天 24 小時提供。"

  service_b:
    always_open: false
    schedule:
      default:
        start: "09:00"
        end: "18:00"
    hours_text: "服務 B 每日上午 9 點至下午 6 點。"

  service_c:
    always_open: false
    closed_days: [6]                 # 0=Mon … 6=Sun
    schedule:
      weekday:
        start: "08:00"
        end: "17:00"
      saturday:
        start: "08:00"
        end: "12:00"
    hours_text:
      weekday: "平日上午 8 點至下午 5 點，週六上午 8 點至中午 12 點，週日休息。"
      saturday: "週六上午 8 點至中午 12 點，週日休息。"
      closed: "今日未營業，平日上午 8 點至下午 5 點，週六上午 8 點至中午 12 點。"

# ── QA 資料庫（lookup_qa 使用）──────────────────────────
qa_data:
  - keywords: ["關鍵字1", "關鍵字2"]
    answer: "對消費者播報的完整語音內容，語氣口語自然。"

  - keywords: ["費用", "多少錢", "收費"]
    answer: "服務費用依項目而異，詳細費用請現場詢問。"

  - keywords: ["預約", "需要預約"]
    answer: "本站採現場辦理，無需預約，依順序服務。"
