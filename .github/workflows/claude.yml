name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  # ── Job 1：Copilot 做完 review 後，自動呼叫 Claude 處理建議 ──
  claude-after-copilot:
    runs-on: ubuntu-latest
    # 只在 Copilot bot 提交 review 時觸發
    if: |
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code (after Copilot review)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            GitHub Copilot just completed a code review on this PR.
            Please read Copilot's review comments, then:
            1. Address any valid issues Copilot raised by making fixes
            2. Add your own suggestions if you spot anything Copilot missed
            3. Leave a summary comment of what you changed and why

  # ── Job 2：手動 @claude 觸發（通用互動） ──
  claude-interactive:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (
        contains(github.event.issue.body, '@claude') ||
        contains(github.event.issue.title, '@claude')
      ))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── 可選：偵測專案類型後才執行對應 setup ──
      - name: Detect project type
        id: detect
        run: |
          if [ -f "package.json" ]; then echo "type=node" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then echo "type=python" >> $GITHUB_OUTPUT
          elif [ -f "go.mod" ]; then echo "type=go" >> $GITHUB_OUTPUT
          else echo "type=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js project
        if: steps.detect.outputs.type == 'node'
        run: npm install

      - name: Setup Python project
        if: steps.detect.outputs.type == 'python'
        run: pip install -r requirements.txt 2>/dev/null || pip install -e . 2>/dev/null || true

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 10